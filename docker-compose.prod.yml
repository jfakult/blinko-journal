# NOTE (Workstream 7 / network hardening): the network topology for this
# stack lives in docker-compose.network.yml, applied as an overlay:
#   docker compose -f docker-compose.prod.yml -f docker-compose.network.yml up -d
# The `blinko-network` / `driver: host` block that used to live here was
# unused (no service actually attached to it -- see the commented-out
# `networks:` lines below) and, if it ever *had* been attached, `driver:
# host` would have put containers directly on the host's network namespace
# with no isolation at all -- the opposite of what this stack needs. It's
# removed rather than fixed in place; see docs/workstreams/07-network-hardening.md
# for the real network design and why blinko-website/postgres/whisper are
# split across an internal-only network and a narrow LAN-egress network.

services:
  blinko-website:
    image: ghcr.io/jfakult/blinko-journal:latest
    # container_name: blinko-website
    # CUSTOM-JOURNAL: secrets (NEXTAUTH_SECRET, DATABASE_URL) used to be hardcoded
    # directly in this file, which is committed to git. ${VARS} below are
    # substituted from a `.env` file docker compose auto-loads from this same
    # directory - see .env.prod.tmpl for the template; copy it to `.env` on the
    # actual deploy host and fill in real values (`.env` itself is gitignored,
    # so secrets never get committed).
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://fakult.net/journal
      NEXT_PUBLIC_BASE_URL: https://fakult.net/journal
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      # CUSTOM-JOURNAL: see prisma/seed.ts's seedDefaultAiConfig - self-heals the
      # placeholder Ollama baseURL on next boot once this is set.
      OLLAMA_BASE_URL: http://192.168.1.208:11434
      # WHISPER_BASE_URL: http://192.168.1.208:8000/v1  # uncomment once deployed (infra/whisper-service)
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    # CUSTOM-JOURNAL: was commented out - attachments, voice memos, and installed
    # plugins live in .blinko/ with no persistence otherwise, wiped on every
    # container recreation (a redeploy, not just a crash). Uncommented; adjust the
    # host path to wherever you want this backed up on the Unraid host.
    volumes:
      - ~/blinko-journal/.blinko:/app/.blinko
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - 1111:1111
    healthcheck:
      test: ["CMD", "curl", "-f", "http://blinko-website:1111/"]
      interval: 30s 
      timeout: 10s   
      retries: 5     
      start_period: 30s
    # networks: attached by docker-compose.network.yml (blinko-internal,
    # blinko-egress) -- do not add a `networks:` block here, it would
    # bypass the hardening overlay.

