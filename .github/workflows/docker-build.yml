name: Build and Push Docker Image

# CUSTOM-JOURNAL: retargeted from upstream - was building on push to a stray feature
# branch (fix/multi-select-duplicate-and-export-auth, likely left over from whatever
# upstream commit added this workflow) and pushing to ${{ github.repository }} (i.e.
# whatever this repo is named/owned as on GitHub). Per docs/PROJECT_BRIEF.md §5, this
# fork builds/pushes on merge to `main`, to our own ghcr.io namespace.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jfakult/blinko-journal

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
