<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- CUSTOM-JOURNAL: favicon + PWA icons replaced with the journal "J"
       mark (was Blinko's own icon set) -- see app/public/icons/archive/ for
       the originals and app/vite.config.ts's manifest block for how the
       installed-app name/icons/theme-color are actually wired (the file
       that mattered for "installs as Blinko with a white title bar"). Two
       favicon variants swap automatically with the OS/browser color scheme. -->
  <link rel="icon" href="./icons/favicon-32-light.png" type="image/png" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="./icons/favicon-32-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="application-name" content="Journal" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- CUSTOM-JOURNAL: "black" (opaque dark bar), not "black-translucent" --
       translucent makes content render *under* the iOS status bar, which
       needs safe-area-inset padding this app doesn't have anywhere, and
       would clip the top of the UI on notched/Dynamic-Island iPhones. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Journal" />

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

  <meta name="description" content="A private, self-hosted personal journal" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#15072B" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="theme-color" content="#15072B" />
  <base href="./" />

  <!-- CUSTOM-JOURNAL: was "./manifest.json", pointing at a separate static
       file (app/public/manifest.json, now deleted) that duplicated --
       and could silently drift from -- the manifest vite-plugin-pwa
       actually generates from app/vite.config.ts's `manifest:` block. That
       plugin's default output filename is manifest.webmanifest, so this now
       points at the one place the manifest is actually produced. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <title>Journal</title>
  <!-- 
  <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
  <script>
    var vConsole = new window.VConsole();
  </script> -->
</head>

  <div id="root"></div>
  <script src="./config.js"></script>
  <script type="module" src="./src/main.tsx"></script>

</html>
