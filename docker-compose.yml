# docker-compose.dev.yml
version: '3'

networks:
  blinko-network:
    driver: bridge

volumes:
  # CUSTOM-JOURNAL: neither service had a persistent volume - postgres data lived
  # only in the container's writable layer, and .blinko/ (attachments, voice
  # memos, installed plugins) likewise. Any container recreation (a normal,
  # frequent part of the local dev rebuild loop) would silently wipe both.
  # Found and fixed after backing up existing data via pg_dump + tar.
  blinko-db:
  blinko-files:

services:
  blinko-website:
    container_name: blinko-website
    build:
      context: .
      args:
        # CUSTOM-JOURNAL: USE_MIRROR switches bun/sharp/prisma to registry.npmmirror.com,
        # a China-region mirror upstream Blinko defaults on for users with restricted
        # npm access there. For a US-hosted deployment this is typically slower than
        # the real registry, not faster - and a very plausible cause of a genuine
        # multi-minute bun install hang, not just Docker/timeout overhead.
        USE_MIRROR: "false"
      dockerfile: ./dockerfile
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:1111
      NEXT_PUBLIC_BASE_URL: http://localhost:1111
      NEXTAUTH_SECRET: my_ultra_secure_nextauth_secret
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/postgres
      # CUSTOM-JOURNAL: real Ollama address (compute VM) - see prisma/seed.ts's
      # seedDefaultAiConfig, which self-heals the placeholder baseURL on next boot
      # once this is set. Not up yet as of this writing, so chat/tagging/embeddings/
      # vision won't actually work until that VM is running - config-wise this is
      # already correct and ready.
      OLLAMA_BASE_URL: http://192.168.1.208:11434
      # WHISPER_BASE_URL: http://192.168.1.208:8000/v1  # uncomment once deployed (infra/whisper-service)
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      - 1111:1111
    healthcheck:
      # CUSTOM-JOURNAL: was checking /journal/, which doesn't exist on this
      # root-deployment local dev compose (no subpath here) - fixed to match.
      test: ["CMD", "wget", "--spider", "http://blinko-website:1111/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - blinko-files:/app/.blinko
    networks:
      - blinko-network

  postgres:
    image: postgres:14
    container_name: blinko-postgres
    restart: always
    # ports:
    #  - 5432:5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - blinko-db:/var/lib/postgresql/data
    networks:
      - blinko-network
